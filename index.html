<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<title>벽돌 깨기</title>
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: #0f172a; color: #e2e8f0;
    font-family: -apple-system, "Pretendard", "Noto Sans KR", sans-serif; }
  body { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 12px; padding: 12px; }
  .hud { width: 100%; max-width: 480px; display: flex; justify-content: space-between; font-size: 16px; font-weight: 600; }
  canvas { width: 100%; max-width: 480px; aspect-ratio: 480 / 640; background: #1e293b; border-radius: 12px;
    touch-action: none; box-shadow: 0 8px 30px rgba(0,0,0,.4); }
  .hint { font-size: 13px; color: #94a3b8; text-align: center; }
</style>
</head>
<body>
  <div class="hud"><span id="score">점수 0</span><span id="level">🧱 벽돌 깨기</span><span id="lives">♥♥♥</span></div>
  <canvas id="c" width="480" height="640"></canvas>
  <div class="hint">마우스·터치로 패들 이동 / ← → 키 / 스페이스 또는 클릭으로 발사·재시작</div>
  <button id="mute" type="button" style="background:#334155;color:#e2e8f0;border:0;border-radius:8px;padding:8px 14px;font-size:14px;cursor:pointer">🔊 소리 끄기 (M)</button>

<script>
const cv = document.getElementById('c'), ctx = cv.getContext('2d');
const W = cv.width, H = cv.height;
const COLS = 8, ROWS = 6, BW = 52, BH = 20, GAP = 6;
const OFFX = (W - (COLS * BW + (COLS - 1) * GAP)) / 2, OFFY = 70;
const COLORS = ['#f87171', '#fb923c', '#facc15', '#4ade80', '#38bdf8', '#a78bfa'];

let paddle, ball, bricks, score, lives, state; // state: ready | play | over | win
const keys = {};

// ===== 사운드 (Web Audio로 직접 합성) =====
let AC = null, master = null, musicTimer = null, muted = false;
function startAudio() {
  if (AC) { if (AC.state === 'suspended') AC.resume(); return; }
  try { AC = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) { return; }
  master = AC.createGain(); master.gain.value = muted ? 0 : 0.8; master.connect(AC.destination);
  startNature();
}
function startNature() {
  // 반복 재생용 노이즈 버퍼
  const len = AC.sampleRate * 4, nb = AC.createBuffer(1, len, AC.sampleRate), d = nb.getChannelData(0);
  let b0 = 0, b1 = 0;
  for (let i = 0; i < len; i++) { const w = Math.random() * 2 - 1; b0 = 0.98 * b0 + 0.02 * w; b1 = 0.9 * b1 + 0.1 * w; d[i] = (b0 * 8 + b1 * 0.6); }
  function noiseSrc() { const s = AC.createBufferSource(); s.buffer = nb; s.loop = true; s.start(); return s; }

  // 바람: 저역 노이즈 + 천천히 흔들리는 필터
  const wlp = AC.createBiquadFilter(); wlp.type = 'lowpass'; wlp.frequency.value = 500; wlp.Q.value = 0.7;
  const wl = AC.createOscillator(), wlg = AC.createGain(); wl.frequency.value = 0.08; wlg.gain.value = 250; wl.connect(wlg); wlg.connect(wlp.frequency); wl.start();
  const wg = AC.createGain(); wg.gain.value = 0.28; noiseSrc().connect(wlp); wlp.connect(wg); wg.connect(master);

  // 시냇물: 중고역 노이즈를 빠르게 떨리는 게인으로
  const sbp = AC.createBiquadFilter(); sbp.type = 'bandpass'; sbp.frequency.value = 2200; sbp.Q.value = 0.9;
  const sg = AC.createGain(); sg.gain.value = 0.09;
  const sl = AC.createOscillator(), slg = AC.createGain(); sl.frequency.value = 7; slg.gain.value = 0.05; sl.connect(slg); slg.connect(sg.gain); sl.start();
  const sl2 = AC.createOscillator(), sl2g = AC.createGain(); sl2.frequency.value = 0.2; sl2g.gain.value = 600; sl2.connect(sl2g); sl2g.connect(sbp.frequency); sl2.start();
  noiseSrc().connect(sbp); sbp.connect(sg); sg.connect(master);

  // 풀벌레: 높은 음을 짧게 끊어 울리는 소리
  const cr = AC.createOscillator(); cr.type = 'sine'; cr.frequency.value = 4300;
  const cg = AC.createGain(); cg.gain.value = 0;
  const cl = AC.createOscillator(), clg = AC.createGain(); cl.type = 'square'; cl.frequency.value = 14; clg.gain.value = 0.012; cl.connect(clg); clg.connect(cg.gain);
  const cenv = AC.createGain(); cenv.gain.value = 0.0;
  const cm = AC.createOscillator(), cmg = AC.createGain(); cm.frequency.value = 0.25; cmg.gain.value = 1; cm.connect(cmg); cmg.connect(cenv.gain);
  cr.connect(cg); cg.connect(cenv); cenv.connect(master); cr.start(); cl.start(); cm.start();

  // 새소리: 빠르게 오르내리는 짧은 지저귐
  function bird() {
    if (!AC) return;
    const t0 = AC.currentTime, notes = 2 + Math.floor(Math.random() * 4), base = 2200 + Math.random() * 1800, up = Math.random() < 0.5;
    for (let i = 0; i < notes; i++) {
      const s = t0 + i * 0.11, f = base * (1 + (i % 2 ? 0.18 : 0));
      const o = AC.createOscillator(); o.type = 'sine';
      o.frequency.setValueAtTime(up ? f * 0.8 : f * 1.2, s); o.frequency.exponentialRampToValueAtTime(up ? f * 1.25 : f * 0.75, s + 0.08);
      const g = AC.createGain(); g.gain.setValueAtTime(0.0001, s); g.gain.exponentialRampToValueAtTime(0.07, s + 0.015); g.gain.exponentialRampToValueAtTime(0.0001, s + 0.09);
      o.connect(g); g.connect(master); o.start(s); o.stop(s + 0.1);
    }
    musicTimer = setTimeout(bird, 1800 + Math.random() * 4200);
  }
  musicTimer = setTimeout(bird, 1200);
}
// 배경음: 업로드한 노래(bgm.mp3). 불러오지 못하면 자연의 소리로 대신 재생
function startMusic() {
  let fell = false;
  const fallback = () => { if (!fell) { fell = true; startNature(); } };
  try {
    const au = new Audio('bgm.mp3'); au.loop = true; au.preload = 'auto';
    const src = AC.createMediaElementSource(au);
    const g = AC.createGain(); g.gain.value = 0.7; src.connect(g); g.connect(master);
    au.addEventListener('error', fallback);
    const pr = au.play(); if (pr && pr.catch) pr.catch(fallback);
  } catch (e) { fallback(); }
}
// 뿅! 소리: 빠르게 올라갔다 살짝 내려오는 통통 튀는 음 + 반짝이는 배음
function bark() {
  if (!AC || muted) return;
  const t = AC.currentTime, f = 520 + Math.random() * 260;
  const o = AC.createOscillator(); o.type = 'sine';
  o.frequency.setValueAtTime(f, t);
  o.frequency.exponentialRampToValueAtTime(f * 3, t + 0.07);
  o.frequency.exponentialRampToValueAtTime(f * 2.2, t + 0.16);
  const g = AC.createGain(); g.gain.setValueAtTime(0.0001, t);
  g.gain.exponentialRampToValueAtTime(0.5, t + 0.012); g.gain.exponentialRampToValueAtTime(0.0001, t + 0.2);
  o.connect(g); g.connect(master); o.start(t); o.stop(t + 0.22);
  const o2 = AC.createOscillator(); o2.type = 'triangle';
  o2.frequency.setValueAtTime(f * 2, t); o2.frequency.exponentialRampToValueAtTime(f * 6, t + 0.07);
  const g2 = AC.createGain(); g2.gain.setValueAtTime(0.0001, t);
  g2.gain.exponentialRampToValueAtTime(0.12, t + 0.01); g2.gain.exponentialRampToValueAtTime(0.0001, t + 0.12);
  o2.connect(g2); g2.connect(master); o2.start(t); o2.stop(t + 0.14);
}
function toggleMute() {
  muted = !muted;
  if (master) master.gain.value = muted ? 0 : 0.8;
  document.getElementById('mute').textContent = muted ? '🔇 소리 켜기 (M)' : '🔊 소리 끄기 (M)';
}
document.getElementById('mute').addEventListener('click', e => { e.stopPropagation(); startAudio(); toggleMute(); });

function initBricks() {
  bricks = [];
  for (let r = 0; r < ROWS; r++)
    for (let c = 0; c < COLS; c++)
      bricks.push({ x: OFFX + c * (BW + GAP), y: OFFY + r * (BH + GAP), alive: true, color: COLORS[r] });
}
function resetBall() {
  ball = { x: paddle.x + paddle.w / 2, y: H - 50, r: 8, vx: 0, vy: 0 };
}
function newGame() {
  paddle = { w: 90, h: 12, x: W / 2 - 45, y: H - 36 };
  score = 0; lives = 3; initBricks(); resetBall(); state = 'ready'; updateHud();
}
function updateHud() {
  document.getElementById('score').textContent = '점수 ' + score;
  document.getElementById('lives').textContent = '♥'.repeat(lives) || '—';
}
function launch() {
  startAudio();
  if (state === 'ready') {
    const a = (Math.random() * 0.8 - 0.4);
    ball.vx = 4 * Math.sin(a + 0.3); ball.vy = -4.6; state = 'play';
  } else if (state === 'over' || state === 'win') newGame();
}

function setPaddleFromX(clientX) {
  const rect = cv.getBoundingClientRect();
  const x = (clientX - rect.left) * (W / rect.width);
  paddle.x = Math.max(0, Math.min(W - paddle.w, x - paddle.w / 2));
}
cv.addEventListener('mousemove', e => setPaddleFromX(e.clientX));
cv.addEventListener('touchmove', e => { setPaddleFromX(e.touches[0].clientX); e.preventDefault(); }, { passive: false });
cv.addEventListener('touchstart', e => { setPaddleFromX(e.touches[0].clientX); launch(); e.preventDefault(); }, { passive: false });
cv.addEventListener('click', launch);
addEventListener('keydown', e => {
  keys[e.key] = true;
  if (e.key === ' ') { launch(); e.preventDefault(); }
  if (e.key === 'm' || e.key === 'M') { startAudio(); toggleMute(); }
});
addEventListener('keyup', e => keys[e.key] = false);

function update() {
  if (keys['ArrowLeft']) paddle.x = Math.max(0, paddle.x - 7);
  if (keys['ArrowRight']) paddle.x = Math.min(W - paddle.w, paddle.x + 7);

  if (state === 'ready') { ball.x = paddle.x + paddle.w / 2; ball.y = paddle.y - ball.r - 1; return; }
  if (state !== 'play') return;

  ball.x += ball.vx; ball.y += ball.vy;

  if (ball.x < ball.r) { ball.x = ball.r; ball.vx *= -1; }
  if (ball.x > W - ball.r) { ball.x = W - ball.r; ball.vx *= -1; }
  if (ball.y < ball.r) { ball.y = ball.r; ball.vy *= -1; }

  // paddle
  if (ball.vy > 0 && ball.y + ball.r >= paddle.y && ball.y + ball.r <= paddle.y + paddle.h + 6 &&
      ball.x >= paddle.x - ball.r && ball.x <= paddle.x + paddle.w + ball.r) {
    const hit = (ball.x - (paddle.x + paddle.w / 2)) / (paddle.w / 2); // -1..1
    const speed = Math.min(9, Math.hypot(ball.vx, ball.vy) + 0.1);
    const ang = hit * 1.05;
    ball.vx = speed * Math.sin(ang); ball.vy = -speed * Math.cos(ang);
    ball.y = paddle.y - ball.r;
  }

  // bricks
  for (const b of bricks) {
    if (!b.alive) continue;
    if (ball.x + ball.r > b.x && ball.x - ball.r < b.x + BW && ball.y + ball.r > b.y && ball.y - ball.r < b.y + BH) {
      b.alive = false; score += 10; updateHud(); bark();
      const ox = Math.min(ball.x + ball.r - b.x, b.x + BW - (ball.x - ball.r));
      const oy = Math.min(ball.y + ball.r - b.y, b.y + BH - (ball.y - ball.r));
      if (ox < oy) ball.vx *= -1; else ball.vy *= -1;
      break;
    }
  }
  if (bricks.every(b => !b.alive)) state = 'win';

  // fall
  if (ball.y - ball.r > H) {
    lives--; updateHud();
    if (lives <= 0) state = 'over'; else { resetBall(); state = 'ready'; }
  }
}

function rr(x, y, w, h, r) {
  ctx.beginPath(); ctx.moveTo(x + r, y);
  ctx.arcTo(x + w, y, x + w, y + h, r); ctx.arcTo(x + w, y + h, x, y + h, r);
  ctx.arcTo(x, y + h, x, y, r); ctx.arcTo(x, y, x + w, y, r); ctx.closePath();
}
function msg(t1, t2) {
  ctx.fillStyle = 'rgba(15,23,42,.72)'; ctx.fillRect(0, 0, W, H);
  ctx.fillStyle = '#fff'; ctx.textAlign = 'center';
  ctx.font = 'bold 34px sans-serif'; ctx.fillText(t1, W / 2, H / 2 - 6);
  ctx.font = '16px sans-serif'; ctx.fillStyle = '#cbd5e1'; ctx.fillText(t2, W / 2, H / 2 + 28);
}
function draw() {
  ctx.clearRect(0, 0, W, H);
  for (const b of bricks) if (b.alive) { ctx.fillStyle = b.color; rr(b.x, b.y, BW, BH, 4); ctx.fill(); }
  ctx.fillStyle = '#e2e8f0'; rr(paddle.x, paddle.y, paddle.w, paddle.h, 6); ctx.fill();
  ctx.fillStyle = '#fff'; ctx.beginPath(); ctx.arc(ball.x, ball.y, ball.r, 0, Math.PI * 2); ctx.fill();
  if (state === 'ready') { ctx.fillStyle = '#94a3b8'; ctx.textAlign = 'center'; ctx.font = '16px sans-serif'; ctx.fillText('클릭 또는 스페이스로 발사!', W / 2, H / 2 + 80); }
  if (state === 'over') msg('게임 오버', '클릭 또는 스페이스로 다시 시작');
  if (state === 'win') msg('🎉 클리어!', '클릭 또는 스페이스로 다시 시작');
}
function loop() { update(); draw(); requestAnimationFrame(loop); }
newGame(); loop();
</script>
</body>
</html>
